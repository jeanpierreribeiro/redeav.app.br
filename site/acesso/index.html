<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#01497c">
<title>Acesso restrito | Rede AV</title>
<style>
@font-face{font-family:Sora;font-weight:600;font-display:swap;src:url(sora-600.woff2) format("woff2")}
@font-face{font-family:Sora;font-weight:700;font-display:swap;src:url(sora-700.woff2) format("woff2")}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif;background:#01497c;color:#fff;display:grid;place-items:center;padding:24px;
  background-image:radial-gradient(900px 500px at 15% -10%,rgba(56,129,195,.45),transparent 60%),radial-gradient(700px 420px at 100% 110%,rgba(246,166,19,.14),transparent 60%)}
main{width:100%;max-width:420px}
.logo{display:block;height:44px;width:auto;margin:0 auto 36px}
.card{background:#fff;color:#03233b;border-radius:28px;padding:32px 28px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
h1{font-size:26px;line-height:32px;font-weight:700;margin:0 0 8px;color:#01497c;letter-spacing:-.02em}
p{margin:0 0 22px;font-size:15.5px;line-height:24px;color:#4a5b6c}
label{display:block;font-size:14px;font-weight:600;margin-bottom:8px;color:#01497c}
input{width:100%;height:52px;border-radius:14px;border:1.5px solid #b9c7d6;padding:0 16px;font:inherit;font-size:17px;color:#03233b;background:#fff}
input:focus{outline:3px solid rgba(56,129,195,.4);outline-offset:1px;border-color:#01497c}
button{margin-top:16px;width:100%;height:54px;border:0;border-radius:999px;background:#f6a613;color:#03233b;font:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:background .2s}
button:hover{background:#ffb92e}
button:focus-visible{outline:3px solid #01497c;outline-offset:3px}
.err{display:none;margin:14px 0 0;padding:12px 14px;border-radius:12px;background:#fdecea;color:#8a1f17;font-size:14.5px;line-height:22px}
.err.on{display:block}
small{display:block;text-align:center;margin-top:22px;color:rgba(255,255,255,.75);font-size:13.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.svg" alt="Rede AV">
  <form class="card" method="post" action="/acesso/" autocomplete="off">
    <h1>Acesso restrito</h1>
    <p>Este protótipo está em validação. Digite o código de acesso para continuar.</p>
    <label for="codigo">Código de acesso</label>
    <input id="codigo" name="codigo" type="password" required autofocus autocapitalize="off" autocorrect="off" spellcheck="false" aria-describedby="erro">
    <div id="erro" class="err" role="alert">Código incorreto. Confira e tente de novo.</div>
    <button type="submit">Entrar</button>
  </form>
  <small>Conteúdo confidencial, não indexado em buscadores.</small>
</main>
<script>
try{if(new URLSearchParams(location.search).get('erro')){document.getElementById('erro').classList.add('on');history.replaceState(null,'','/acesso/')}}catch(e){}
/* Só para teste local: abrindo este arquivo direto do disco (file://) não há servidor, então o código é conferido aqui.
   Online (Vercel) este trecho não roda: quem confere é o servidor (middleware.js), antes de entregar qualquer arquivo. */
if(location.protocol==='file:'){
  document.querySelector('form').addEventListener('submit',async function(e){
    e.preventDefault();
    var v=document.getElementById('codigo').value.trim(),err=document.getElementById('erro');
    var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('redeav-prototipo:'+v));
    var hex=Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('');
    if(v&&hex==='b19b5e08841a3fca7635d7ec2848ff5b1d011a3f1f65428f30612328c5237844'){location.href='../index.html'}else{err.classList.add('on');document.getElementById('codigo').select()}
  });
}
</script>
</body>
</html>
